<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- 浏览器 favicon + manifest 里的 any 图标。
       必须自包含：渐变写在这里，不能引用外部资源。 -->
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#C79A2E"/>
      <stop offset="1" stop-color="#D9662A"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" rx="228" fill="url(#brand)"/>
  <g fill="none" stroke="#ffffff" stroke-width="80" stroke-linecap="round" stroke-linejoin="round">
    <path d="M280 232 L512 462"/>
    <path d="M744 232 L512 462"/>
    <path d="M512 462 L512 792"/>
    <path d="M336 568 L688 568"/>
    <path d="M336 692 L688 692"/>
  </g>
</svg>
