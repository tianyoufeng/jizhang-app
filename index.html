<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#3b7dd8" />
  <title>记账本</title>
  <link rel="icon" href="./icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <!-- 用 default 而不是 black-translucent：
       black-translucent 会让页面顶到状态栏下面，但 iOS 的状态栏文字**恒为白色**，
       而浅色主题下顶栏是 #ffffff —— 白字压白底，时间和电量就看不见了。
       default 则由系统按当前外观自动取（浅色＝黑字白底，深色＝白字黑底），
       而本 App 默认正好跟随系统深浅色，两边天然一致。 -->
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="记账本" />
  <link rel="stylesheet" href="/src/styles.css" />
</head>
<body>
  <div id="app">
    <header id="topbar">
      <button id="ledgerSwitch" class="ledger-btn" type="button" aria-label="切换账本">
        <span id="ledgerName">日常账本</span>
        <svg class="chev" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M7 10l5 5 5-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <h1 id="pageTitle">记账</h1>
      <button id="themeToggle" class="icon-btn" type="button" aria-label="切换深浅色">
        <svg class="ico-moon" viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <svg class="ico-sun" viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2v2.4M12 19.6V22M4.2 4.2l1.7 1.7M18.1 18.1l1.7 1.7M2 12h2.4M19.6 12H22M4.2 19.8l1.7-1.7M18.1 5.9l1.7-1.7"/></svg>
      </button>
    </header>

    <main id="view"></main>

    <nav id="tabbar">
      <button class="tab active" data-tab="record" type="button">
        <svg class="tab-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
        <span class="tab-txt">记账</span>
      </button>
      <button class="tab" data-tab="list" type="button">
        <svg class="tab-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01"/></svg>
        <span class="tab-txt">账单</span>
      </button>
      <button class="tab" data-tab="stats" type="button">
        <svg class="tab-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 20V10M12 20V4M6 20v-6"/></svg>
        <span class="tab-txt">统计</span>
      </button>
      <button class="tab" data-tab="settings" type="button">
        <svg class="tab-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 21v-6M4 11V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1.5 15h5M9.5 8h5M17.5 16h5"/></svg>
        <span class="tab-txt">设置</span>
      </button>
    </nav>
  </div>

  <div id="sheetRoot"></div>
  <div id="toastRoot"></div>
  <div id="dialogRoot"></div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
